<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:fn="http://xmlns.jcp.org/jsp/jstl/functions">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Employee Performance History</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .employee-info {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .employee-info strong {
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #9c27b0;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .rating-excellent {
            color: #4CAF50;
            font-weight: bold;
        }
        .rating-good {
            color: #2196F3;
            font-weight: bold;
        }
        .rating-average {
            color: #ff9800;
            font-weight: bold;
        }
        .rating-poor {
            color: #f44336;
            font-weight: bold;
        }
        .btn {
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-block;
            margin: 5px 5px 5px 0;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-primary:hover {
            background-color: #45a049;
        }
        .btn-back {
            background-color: #6c757d;
            color: white;
        }
        .btn-back:hover {
            background-color: #5a6268;
        }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee Performance History</h1>
        
        <h:panelGroup rendered="#{not empty employeeBean.employee}">
            <div class="employee-info">
                <strong>Employee:</strong> #{employeeBean.employee.name} (#{employeeBean.employee.email})<br/>
                <strong>Department:</strong> #{employeeBean.employee.department}
            </div>
        </h:panelGroup>
        
        <h:form>
            <h:commandLink value="Add New Performance" 
                           action="#{employeeBean.showPerformanceForm}"
                           styleClass="btn btn-primary">
                <f:param name="id" value="#{employeeBean.employeeId}"/>
            </h:commandLink>
            <h:commandLink value="Back to Employee Details" 
                           action="#{employeeBean.viewEmployee}"
                           styleClass="btn btn-back">
                <f:param name="id" value="#{employeeBean.employeeId}"/>
            </h:commandLink>
        </h:form>
        
        <h:form>
            <h:dataTable value="#{employeeBean.performances}" var="perf" 
                         styleClass="table" headerClass="table-header"
                         rendered="#{not empty employeeBean.performances}">
                <h:column>
                    <f:facet name="header">Month</f:facet>
                    <strong>#{perf.month}</strong>
                </h:column>
                <h:column>
                    <f:facet name="header">Performance Score</f:facet>
                    <h:outputText value="#{perf.performanceScore}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">Rating</f:facet>
                    <h:outputText value="#{perf.rating}" 
                                 styleClass="rating-#{fn:toLowerCase(perf.rating)}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">Notes</f:facet>
                    <h:outputText value="#{empty perf.notes ? '-' : perf.notes}"/>
                </h:column>
                <h:column>
                    <f:facet name="header">Created At</f:facet>
                    <h:outputText value="#{perf.createdAt}">
                        <f:convertDateTime pattern="yyyy-MM-dd HH:mm"/>
                    </h:outputText>
                </h:column>
            </h:dataTable>
        </h:form>
        
        <h:panelGroup rendered="#{empty employeeBean.performances}">
            <p class="no-data">No performance records found.</p>
        </h:panelGroup>
    </div>
</body>
</html>
