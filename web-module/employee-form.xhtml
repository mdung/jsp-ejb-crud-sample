<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <!-- Dựa vào employee.id để phân biệt Add / Edit -->
    <title>#{empty employeeBean.employee.id ? 'Add New Employee' : 'Edit Employee'}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        .required {
            color: red;
        }
        .btn {
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-primary:hover {
            background-color: #45a049;
        }
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>#{empty employeeBean.employee.id ? 'Add New Employee' : 'Edit Employee'}</h1>
        
        <!-- Show all messages (field + global) -->
        <h:messages globalOnly="false" errorClass="error" infoClass="message"/>
        
            <h:form id="employeeForm">
                <!-- Giữ lại ID khi edit để RequestScoped bean nhận được trên submit -->
                <h:inputHidden id="employeeId" value="#{employeeBean.employee.id}"/>
                <div class="form-group">
                    <h:outputLabel for="firstName" value="First Name" styleClass="label"/>
                    <h:inputText id="firstName" value="#{employeeBean.employee.firstName}" 
                                maxlength="50" style="width: 100%; padding: 10px;"/>
                    <h:message for="firstName" styleClass="error"/>
                </div>
                
                <div class="form-group">
                    <h:outputLabel for="name" value="Name *" styleClass="label"/>
                    <h:inputText id="name" value="#{employeeBean.employee.name}" 
                                required="true" requiredMessage="Name is required"
                                maxlength="100" style="width: 100%; padding: 10px;"/>
                    <h:message for="name" styleClass="error"/>
                </div>
                
                <div class="form-group">
                    <h:outputLabel for="email" value="Email *" styleClass="label"/>
                    <h:inputText id="email" value="#{employeeBean.employee.email}" 
                                required="true" requiredMessage="Email is required"
                                maxlength="100" style="width: 100%; padding: 10px;"/>
                    <h:message for="email" styleClass="error"/>
                </div>
                
            <div class="form-group">
                <h:outputLabel for="department" value="Department *" styleClass="label"/>
                <h:inputText id="department" value="#{employeeBean.employee.department}" 
                            required="true" requiredMessage="Department is required"
                            maxlength="50" style="width: 100%; padding: 10px;"/>
                <h:message for="department" styleClass="error"/>
            </div>
            
            <div class="form-group">
                <h:outputLabel for="dateOfBirth" value="Date of Birth (YYYY-MM-DD)" styleClass="label"/>
                <h:inputText id="dateOfBirth" value="#{employeeBean.employee.dateOfBirth}" 
                            style="width: 100%; padding: 10px;"
                            placeholder="YYYY-MM-DD">
                    <f:convertDateTime pattern="yyyy-MM-dd"/>
                </h:inputText>
                <h:message for="dateOfBirth" styleClass="error"/>
            </div>
            
            <div class="form-group">
                <h:outputLabel for="active" value="Status" styleClass="label"/>
                <h:selectBooleanCheckbox id="active" value="#{employeeBean.employee.active}" 
                                         style="margin-left: 10px;"/>
                <h:outputText value="Active" style="margin-left: 5px;"/>
                <h:message for="active" styleClass="error"/>
            </div>
            
                <div class="form-group">
                    <h:commandButton value="#{empty employeeBean.employee.id ? 'Create Employee' : 'Update Employee'}" 
                                   action="#{employeeBean.submitForm}"
                                   styleClass="btn btn-primary"/>
                    <h:commandLink value="Cancel" action="employee-list?faces-redirect=true" 
                                  styleClass="btn btn-secondary"
                                  immediate="true"/>
                </div>
            </h:form>
    </div>
</body>
</html>
